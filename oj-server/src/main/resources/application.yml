server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 2MB
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${db.host}:3306/online_judge?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${db.password}

  ai:
    chat:
      memory:
        repository:
          jdbc:
            # 启动时自动建 SPRING_AI_CHAT_MEMORY 表（CREATE TABLE IF NOT EXISTS，重复执行无害）
            initialize-schema: always
    # 默认重试 10 次、退避到分钟级，用户会一直卡住；这里收紧到最多 3 次、总等待几秒
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    deepseek:
      api-key: ${ai.api-key}
      base-url: https://api.deepseek.com
      chat:
        model: deepseek-v4-flash
        max-tokens: 1500

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
  mapper-locations: classpath*:com/chenru1chao/mapper/*.xml

test-case:
  file-path:
    prefix: ${test-case.file-path.prefix}

oj:
  ai:
    memory:
      # 每次带进上下文的历史预算（估算 token），超出就从最旧的开始丢
      max-tokens: 3000
      max-messages: 10
      # 超过这个天数的会话记忆会被定时任务清掉
      retention-days: 7
  jwt:
    key: ${oj.jwt.key}
    ttl: ${oj.jwt.ttl}
    token-name: ${oj.jwt.token-name}
  alioss:
    access-key-id: ${oj.alioss.access-key-id}
    access-key-secret: ${oj.alioss.access-key-secret}
    bucket-name: ${oj.alioss.bucket-name}
    endpoint: ${oj.alioss.endpoint}
    max-size-mb: 2
    allowed-extensions: "jpg,png"